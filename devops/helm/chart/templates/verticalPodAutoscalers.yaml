{{- range $deployName, $deployment := $.Values.deployments -}}{{- if $deployment.enabled -}}{{- if $deployment.autoscaler -}}{{- if $deployment.autoscaler.vertical -}}
{{- $fullDeployName := printf "%s-%s" $.Release.Name $deployName | trunc 63 | trimSuffix "-" }}

apiVersion: poc.autoscaling.k8s.io/v1alpha1
kind: VerticalPodAutoscaler
metadata:
  labels:
    app: {{ $.Chart.Name }}
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
    deployment: {{ $fullDeployName }}
    heritage: {{ $.Release.Service }}
    release: {{ $.Release.Name }}
  name: {{ $fullDeployName }}
spec:
  selector:
    matchLabels:
      app: {{ $.Chart.Name }}
      deployment: {{ $fullDeployName }}
      release: {{ $.Release.Name }}
  updatePolicy:
    updateMode: {{ $deployment.autoscaler.vertical.mode | quote }}
---
{{- end -}}{{- end -}}{{- end -}}{{- end -}}{{/* component loop */}}