        env_vars:
          ASPNETCORE_ENVIRONMENT: ${aspnetcore_environment}
          DATABASE_HOST: ${database_host_for_k8s_access}
          DATABASE_PORT: "5432"
          DATABASE_NAME: ${database_name}
          DATABASE_USERNAME: ${db_migrations_username}
          DATABASE_PASSWORD: ${db_password_migrations}
          Kestrel__Endpoints__Http__Url: "http://0.0.0.0:5011"
          API_SERVICE_USERNAME: ${api_service_username}
          API_SERVICE_USER_PASSWORD: ${api_service_user_password}
          AzureAd__Instance: "https://login.microsoftonline.com/"
          AzureAd__TenantId: "${azure_tenant_id}"
          AzureAd__ClientId: "${azure_api_client_id}"
          GROUP_PERMISSIONS_URL: "${group_permissions_url}"
          CORS_ALLOWED_HOSTS: "${cors_allowed_hosts}"
          Serilog__MinimumLevel__Default: "${log_level}"
          Aws__DefaultRegion: "${aws_region}"
          AWS_DEFAULT_REGION: "${aws_region}"
          Aws__AccessKey: "${aws_access_key}"
          Aws__SecretKey: "${aws_secret_key}"
          FactoryCatalog__BaseUrl: "${catalog_internal_url}"
          FactoryCatalog__Username: ${api_service_username}
          FactoryCatalog__Password: ${api_service_user_password}
          ShipmentService__BaseUrl: "${shipment_service_base_url}"
          ShipmentService__Username: "${shipment_service_username}"
          ShipmentService__Password: "${shipment_service_password}"
          MasterCatalog__BaseUrl: "${master_catalog_base_url}"
          MasterCatalog__Username: "${master_catalog_username}"
          MasterCatalog__Password: "${master_catalog_password}"
          OrderItems__QueueUrl: ${ocs_order_items_queue_url}
          SupplierEvents__QueueUrl: ${supplier_events_queue_url}
          BalancerEvents__AllocationDecidedTopicArn: ${allocation_decided_topic_arn}
          BalancerEvents__QuoteProducedTopicArn: ${quote_produced_topic_arn}
          DD_AGENT_HOST: "datadog-agent.datadog.svc.cluster.local"
          DD_TRACE_AGENT_PORT: "8126"
