          periodSeconds: 10

        persistentVolumeMounts: {}

        service:
          annotations: {}
          labels: {}
          clusterIP: ""
          externalIPs: []
          ports:
            http:
              servicePort: 80
              targetPort: 5011
              protocol: TCP
          type: ClusterIP

        ingress:
          main:
            enabled: true
            path: /
            servicePort: 80
            annotations:
              kubernetes.io/ingress.class: "${ingress_class}"
              nginx.ingress.kubernetes.io/client-body-buffer-size: 3M
              nginx.ingress.kubernetes.io/proxy-body-size: 20m
