          DATABASE_HOST: ${database_host_for_k8s_access}
          DATABASE_PORT: "5432"
          DATABASE_NAME: ${database_name}
          DATABASE_USERNAME: ${db_migrations_username}
          DATABASE_PASSWORD: ${db_password_migrations}

        resources:
          requests:
            cpu: 10m
            memory: 50Mi
          limits:
            cpu: 2000m
            memory: 4096Mi

    serviceAccountName: "${k8s_namespace}"
    securityContext:
      fsGroup: 65534

    containers:
      main:
        enabled: true

        image:
          repository: tenen/${project_name}-balancer
          tag: "${context_hash_balancer}"

        extraArgs: {}

        ports:
