          BALANCER_BASE_API_URL_ENV_VAR: "${balancer_url}/"
          AZURE_CLIENT_ID_ENV_VAR: "${azure_ui_client_id}"
          AZURE_BACKEND_SCOPE_ENV_VAR: "${azure_backend_scope}"
          AZURE_TENANT_ID_ENV_VAR: "${azure_tenant_id}"
          SERVICES_CONFIG_URL_ENV_VAR: ${services_config_url}
