          DD_ENV: "${deploy_env}"
          DD_SERVICE: "factory-catalog-balancer"
          DD_VERSION: "${app_version}"
          DD_LOGS_DIRECT_SUBMISSION_MINIMUM_LEVEL: "${log_level}"
